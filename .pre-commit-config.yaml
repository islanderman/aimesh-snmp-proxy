# Hooks run on every commit and in CI (`pre-commit run --all-files`).
# Every rev is a full commit SHA; the comment names the release it freezes.
minimum_pre_commit_version: '4.0.0'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      # --unsafe only parses: mkdocs.yml uses python tags a safe load rejects.
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      # tests/fixtures/ holds byte-exact captures: no whitespace or newline fixes.
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/

  # Keep this rev equal to the ruff version locked in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # On commit: scans the staged changes.
      - id: gitleaks
      # CI runs this one by hand: `--hook-stage manual` scans every commit in the history.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in the whole history
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f # frozen: v0.50.0
    hooks:
      - id: markdownlint
        args: [--fix]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        additional_dependencies: ['prettier@3.9.10']
        types_or: [markdown, yaml, json]
      # The index pinned in pyproject.toml decides, so ignore an index set in the shell.
      - id: uv-lock-check
        name: uv lock --check
        entry: env -u UV_INDEX_URL -u UV_DEFAULT_INDEX uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
